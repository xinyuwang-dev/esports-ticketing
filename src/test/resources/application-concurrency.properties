spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Prevent startup Redis synchronization from affecting the comparison.
# The Redis scenario initializes only its temporary test key.
app.order.mode=mysql

# Keep the MySQL connection pool identical across repeated runs.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10

spring.data.redis.host=localhost
spring.data.redis.port=16379
