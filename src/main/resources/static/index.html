<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Sports Ticketing</title>
</head>

<body>

<h1>E-Sports Ticketing System</h1>

<p>Find and purchase tickets for upcoming e-sports events.</p>

<h2>Upcoming Events</h2>

<div id="event-list">
    Loading events...
</div>

<h2>Tickets</h2>

<div id="ticket-list">
</div>

<script>
    fetch("/api/events")
        .then(response => response.json())
        .then(events => {
            const eventList = document.getElementById("event-list");

            eventList.innerHTML = "";

            events.forEach(event => {
                eventList.innerHTML += `
                <div>
                    <h3>${event.title}</h3>
                    <p>Status: ${event.status}</p>

                    <button onclick="loadTickets(${event.id})">
                        View Tickets
                    </button>
                </div>
            `;
            });
        });


    function loadTickets(eventId) {

        fetch(`/api/events/${eventId}/ticket-categories`)
            .then(response => response.json())
            .then(tickets => {

                const ticketList = document.getElementById("ticket-list");

                ticketList.innerHTML = "";

                tickets.forEach(ticket => {
                    ticketList.innerHTML += `
                    <div>
                        <h3>${ticket.categoryName}</h3>
                        <p>Price: £${ticket.basePrice}</p>
                        <p>Available: ${ticket.availableStock}</p>
                    </div>
                `;
                });
            });
    }
</script>

</body>
</html>
