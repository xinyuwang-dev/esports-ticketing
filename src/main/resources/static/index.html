<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Sports Ticketing</title>
</head>

<body>

<section id="login-section">
    <h2>Login</h2>

    <label for="username">Username:</label>
    <input id="username" type="text">

    <label for="password">Password:</label>
    <input id="password" type="password">

    <button onclick="login()">Login</button>

    <p id="login-message"></p>
</section>

<section id="register-section">

    <h2>Register</h2>

    <label for="register-username">Username:</label>
    <input id="register-username" type="text">

    <label for="register-email">Email:</label>
    <input id="register-email" type="email">

    <label for="register-password">Password:</label>
    <input id="register-password" type="password">

    <button onclick="register()">Register</button>

    <p id="register-message"></p>

</section>

<h1>E-Sports Ticketing System</h1>

<p>Find and purchase tickets for upcoming e-sports events.</p>

<h2>Upcoming Events</h2>

<div id="event-list">
    Loading events...
</div>

<h2>Tickets</h2>

<div id="ticket-list">
</div>

<script>

    let currentUser = null;

    function login() {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        fetch("/api/users/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Invalid username or password");
                }

                return response.json();
            })
            .then(user => {
                currentUser = user;

                document.getElementById("login-message").textContent =
                    "Login successful. Welcome, " + user.username;
            })
            .catch(error => {
                currentUser = null;

                document.getElementById("login-message").textContent =
                    "Invalid username or password";
            });
    }

    fetch("/api/events")
        .then(response => response.json())
        .then(events => {
            const eventList = document.getElementById("event-list");

            eventList.innerHTML = "";

            events.forEach(event => {
                eventList.innerHTML += `
                <div>
                    <h3>${event.title}</h3>
                    <p>Status: ${event.status}</p>

                    <button onclick="loadTickets(${event.id})">
                        View Tickets
                    </button>
                </div>
            `;
            });
        });


    function loadTickets(eventId) {

        fetch(`/api/events/${eventId}/ticket-categories`)
            .then(response => response.json())
            .then(tickets => {

                const ticketList = document.getElementById("ticket-list");

                ticketList.innerHTML = "";

                tickets.forEach(ticket => {
                    ticketList.innerHTML += `
                      <div>
                         <h3>${ticket.categoryName}</h3>
                         <p>Base Price: £${ticket.basePrice}</p>

                         ${ticket.dynamicPricing
                            ? `<p>Current Price: £${ticket.currentPrice}</p>
                            <p>Dynamic Pricing: Enabled</p>`
                            : `<p>Fixed Price</p>`}

                         <p>Available: ${ticket.availableStock}</p>

                         <button onclick="purchaseTicket(${ticket.id}, ${eventId})">
                            Buy Ticket
                         </button>
                      </div>
                    `;
                });
            });
    }

    function purchaseTicket(categoryId, eventId) {

        if (currentUser === null) {
            alert("Please login before purchasing a ticket.");
            return;
        }

        fetch("/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                userId: currentUser.id,
                categoryId: categoryId
            })
        })
            .then(response => response.json())
            .then(order => {
                alert(
                    `Order created!\nOrder ID: ${order.id}\nFinal amount: £${order.finalAmount}`
                );
                loadTickets(eventId);
            });
    }

    function register() {

        const username =
            document.getElementById("register-username").value;

        const email =
            document.getElementById("register-email").value;

        const password =
            document.getElementById("register-password").value;

        const message =
            document.getElementById("register-message");

        fetch("/api/users/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        })
            .then(response => {

                if (response.status === 201) {
                    return response.json();
                }

                if (response.status === 400) {
                    throw new Error(
                        "Please enter a valid username, email, and password of at least 8 characters."
                    );
                }

                if (response.status === 409) {
                    throw new Error("Username or email already exists.");
                }

                throw new Error("Registration failed.");
            })
            .then(user => {
                message.textContent =
                    `Registration successful. You can now log in as ${user.username}.`;
            })
            .catch(error => {
                message.textContent = error.message;
            });
    }
</script>

</body>
</html>
